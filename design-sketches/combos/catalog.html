<meta charset="utf-8">
<title>Docs Redesign Ideas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: scene switcher. Tabs on top, one live 3D scene at full size, notes below. Only one WebGL scene runs at a time. */
:root {
  --bg: #f5f5f5; --card: #fafafa; --ink: #111; --text: #1a1a1a; --dim: #777; --rule: #ccc; --rule2: #ddd; --accent: #ff6b6b; --accent-ink: #d9363b;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0a0a; --card: #000; --ink: #fff; --text: #e0e0e0; --dim: #888; --rule: #444; --rule2: #333; --accent-ink: #ff6b6b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0a0a0a; --card: #000; --ink: #fff; --text: #e0e0e0; --dim: #888; --rule: #444; --rule2: #333; --accent-ink: #ff6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; color: var(--accent); margin: 0; }
h1::before { content: "$ "; }
.keys { color: var(--dim); font-size: 12px; margin-left: auto; }
.keys kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; padding: 0 5px; color: var(--ink); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--card); }
.tab { font: 13px var(--mono); text-align: left; padding: 10px 14px; border: 0; border-right: 1px solid var(--rule2); background: transparent; color: var(--dim); cursor: pointer; display: grid; gap: 2px; min-width: 0; transition: background .15s, color .15s; }
.tab:last-child { border-right: 0; }
.tab b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab span { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab:hover { background: var(--bg); }
.tab[aria-selected="true"] { background: var(--accent); color: #000; }
.tab[aria-selected="true"] b { color: #000; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 760px) { .tabs { grid-template-columns: 1fr 1fr; } .tab:nth-child(2) { border-right: 0; } .tab:nth-child(-n+2) { border-bottom: 1px solid var(--rule2); } }
.viewer { position: relative; height: clamp(420px, 70vh, 760px); border: 1px solid var(--rule); background: #0b0d10; }
.viewer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; font: 18px var(--mono); width: 38px; height: 52px; border: 1px solid #3a3f47; background: rgba(8,10,12,.75); color: #c9cfd6; cursor: pointer; }
.nav:hover, .nav:focus-visible { border-color: #ff6b6b; color: #fff; outline: none; }
.prev { left: 10px; } .next { right: 10px; }
.info { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; border: 1px solid var(--rule); background: var(--card); padding: 16px; }
@media (max-width: 760px) { .info { grid-template-columns: 1fr; } }
.info h2 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
.info p { margin: 0; color: var(--dim); font-size: 13.5px; }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
dt { color: var(--dim); } dd { margin: 0; }
.open { color: var(--accent-ink); }
</style>

<div class="wrap">
  <div class="top"><h1>Docs section: 4 redesign ideas</h1><span class="keys"><kbd>←</kbd> <kbd>→</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to switch · each sketch is interactive</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="viewer">
    <button class="nav prev" type="button" id="prev" aria-label="Previous scene">‹</button>
    <iframe id="frame" title="3D scene" allow="fullscreen"></iframe>
    <button class="nav next" type="button" id="next" aria-label="Next scene">›</button>
  </div>
  <div class="info" id="info"></div>
</div>

<script>
const scenes = [
  { id: 'home', file: 'docs-1-home.html', name: 'Docs home', sub: 'search first, start here, full map',
    desc: 'A real front door for /docs: version badge, search across all 18 pages (press / anywhere), a four-step "Start here" strip with the real install, doctor, pull and launch commands, a map of all six sections, and two quick exits for when something is broken.',
    motion: 'instant search with highlighted matches, / shortcut, hover lift on sections', where: '/docs landing' },
  { id: 'reader', file: 'docs-2-reader.html', name: 'Reader page', sub: 'tree, outline, next step',
    desc: 'The real Installation page in a calmer three-pane layout: section tree with read progress and a version picker, a readable column with copyable commands, a note callout and a clean table, an outline that follows your scroll, a reading progress bar, prev/next, "was this helpful?" and edit on GitHub.',
    motion: 'scroll spy on the outline, reading progress bar, copy buttons, feedback', where: 'every /docs page' },
  { id: 'tracks', file: 'docs-3-tracks.html', name: 'Learning tracks', sub: 'docs by goal, with progress',
    desc: 'The same 18 pages grouped into four goals (Start, Run agents, Lock it down, Extend), with progress remembered in the browser and a "continue where you left off" prompt. Each page shows where you are in the track and what to read next.',
    motion: 'track switching, checkable steps, progress bars', where: '/docs landing (alongside or instead of the map)' },
  { id: 'troubleshoot', file: 'docs-4-troubleshoot.html', name: 'Troubleshooter', sub: 'paste an error, get the fix',
    desc: 'The Troubleshooting section as a tool. Paste an error message and the matching Common Errors entry opens with its causes and copyable fixes; pick macOS or Linux to see every nanosb doctor check, with the fix hint for failures. All text comes from the real docs.',
    motion: 'live error matching, OS toggle, expandable doctor lines', where: '/docs/troubleshooting' }
];
const tabs = document.getElementById('tabs'), frame = document.getElementById('frame'), info = document.getElementById('info');
scenes.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.role = 'tab'; b.id = 'tab-' + s.id;
  b.innerHTML = `<b>${i + 1} · ${s.name}</b><span>${s.sub}</span>`; b.onclick = () => show(i); tabs.append(b);
});
let cur = -1;
function show(i, fromHash) {
  i = (i + scenes.length) % scenes.length; if (i === cur) return; cur = i; const s = scenes[i];
  [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  frame.src = s.file + '?embed'; frame.title = s.name + ' 3D scene';
  info.innerHTML = `<div><h2>${s.name}</h2><p>${s.desc}</p></div><dl><dt>motion</dt><dd>${s.motion}</dd><dt>goes on</dt><dd>${s.where}</dd><dt>full page</dt><dd><a class="open" href="${s.file}">open ${s.file} →</a></dd></dl>`;
  if (!fromHash && location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id);
}
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
const onKey = k => { if (k === 'ArrowRight') show(cur + 1); else if (k === 'ArrowLeft') show(cur - 1); else if (/^[1-4]$/.test(k)) show(+k - 1); };
addEventListener('keydown', e => { if (!e.target.closest('input, textarea')) onKey(e.key); });
// keys pressed inside the scene iframe are forwarded here
addEventListener('message', e => { if (e.source === frame.contentWindow && e.data && e.data.nsKey) onKey(e.data.nsKey); });
const fromHash = () => { const i = scenes.findIndex(s => '#' + s.id === location.hash); show(i < 0 ? 0 : i, true); };
addEventListener('hashchange', fromHash); fromHash();
</script>
