name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout articles
        uses: actions/checkout@v4
        with:
          repository: nanosandboxai/articles
          ref: main
          path: articles

      - name: Checkout agents-registry
        uses: actions/checkout@v4
        with:
          repository: nanosandboxai/agents-registry
          ref: main
          path: agents-registry

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compute cache date key
        id: cache-date
        run: date +"date=%Y-%m-%d" >> "$GITHUB_OUTPUT"

      - name: Restore generated data cache
        uses: actions/cache@v4
        with:
          path: web/.generated/data
          key: ${{ runner.os }}-generated-data-${{ steps.cache-date.outputs.date }}-${{ hashFiles('web/vite.config.ts', 'web/content/docs/**', 'articles/**', 'agents-registry/**') }}
          restore-keys: |
            ${{ runner.os }}-generated-data-${{ steps.cache-date.outputs.date }}-
            ${{ runner.os }}-generated-data-

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          DATA_FETCH_TIMEOUT_MS: 8000
          MCP_MAX_PAGES: 20
          DATA_CACHE_MAX_AGE_MS: 86400000

      - name: Copy 404.html for SPA routing
        run: cp web/dist/index.html web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
